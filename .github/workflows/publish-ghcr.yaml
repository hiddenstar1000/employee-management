name: Publish Docker Images to GHCR

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      contents: read
      packages: write
    env:
      KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
      IMAGE_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'employee-management-api/pom.xml'

      - name: Create .env file for API
        run: |
          cat <<EOF > employee-management-api/.env
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          PORT=${{ secrets.PORT || '8080' }}
          ENCRYPTION_SECRET_KEY=${{ secrets.ENCRYPTION_SECRET_KEY }}
          EOF

      - name: Build API JAR with Maven
        run: |
          cd employee-management-api
          mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hiddenstar1000
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./employee-management-api
          push: true
          tags: ghcr.io/hiddenstar1000/employee-management-api:${{ env.IMAGE_TAG }}

      - name: Create .env file for UI
        run: |
          cat <<EOF > employee-management-ui/.env
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          EOF

      - name: Build and Push UI Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./employee-management-ui
          push: true
          tags: ghcr.io/hiddenstar1000/employee-management-ui:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Set up Kubeconfig
        if: ${{ env.KUBECONFIG_SECRET != '' }}
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Kubernetes Secret from GitHub Secrets
        if: ${{ env.KUBECONFIG_SECRET != '' }}
        run: |
          kubectl create secret generic mongodb-atlas-secret \
            --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            --from-literal=ENCRYPTION_SECRET_KEY="${{ secrets.ENCRYPTION_SECRET_KEY }}" \
            --namespace=app-em-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy GHCR Docker Registry Secret
        if: ${{ env.KUBECONFIG_SECRET != '' }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=hiddenstar1000 \
            --docker-password="${{ secrets.GH_PAT }}" \
            --namespace=app-em-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes Manifests
        if: ${{ env.KUBECONFIG_SECRET != '' }}
        run: |
          kubectl apply -f employee-management-api/em-api-deployment.yaml
          kubectl apply -f employee-management-ui/em-ui-deployment.yaml
          kubectl apply -f employee-management-ui/em-ingress.yaml
