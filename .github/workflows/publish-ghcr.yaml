name: Publish Docker Images to GHCR

on:
  push:
    # branches: ["main", "dev"]
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'DEV' || 'PROD' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: "employee-management-api/pom.xml"

      - name: Build API JAR with Maven
        run: |
          cd employee-management-api
          mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./employee-management-api
          push: true
          tags: ghcr.io/${{ secrets.GH_USER }}/employee-management-api:${{ env.IMAGE_TAG }}

      - name: Build and Push UI Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./employee-management-ui
          push: true
          tags: ghcr.io/${{ secrets.GH_USER }}/employee-management-ui:${{ env.IMAGE_TAG }}

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            echo "Deploying ${{ env.IMAGE_TAG }} build to server..."
            if [ "${{ github.ref_name }}" = "dev" ]; then
              sudo su -
              echo "=== Executing DEV Deployment (MicroK8s) ==="
              microk8s kubectl rollout restart deployment/spring-boot-api -n app-em-dev
              microk8s kubectl rollout restart deployment/react-frontend -n app-em-dev
            else
              echo "=== Executing PROD Deployment (Standard K8s) ==="
              echo "${{ secrets.SSH_USER_PASSWORD }}" | sudo -S -i
              sudo kubectl rollout restart deployment/spring-boot-api -n app-em-test
              echo "${{ secrets.SSH_USER_PASSWORD }}" | sudo -S -i
              sudo kubectl rollout restart deployment/react-frontend -n app-em-test
            fi
