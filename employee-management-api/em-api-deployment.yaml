apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-api
  namespace: app-em-test
  labels:
    app: employee-management
    component: api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-management
      component: api
      tier: backend
  template:
    metadata:
      labels:
        app: employee-management
        component: api
        tier: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: spring-boot-api
          image: ghcr.io/hiddenstar1000/employee-management-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-atlas-secret
                  key: MONGODB_URI
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-atlas-secret
                  key: MONGODB_URI
            - name: ENCRYPTION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mongodb-atlas-secret
                  key: ENCRYPTION_SECRET_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-api-service
  namespace: app-em-test
  labels:
    app: employee-management
    component: api
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: employee-management
    component: api
    tier: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
