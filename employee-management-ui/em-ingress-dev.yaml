apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-management-ingress-dev
  namespace: app-em-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dev
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dev.em.dixonai.net
      secretName: dev-em-dixonai-net-tls
  rules:
    - host: dev.em.dixonai.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spring-boot-api-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-frontend-service
                port:
                  number: 80
