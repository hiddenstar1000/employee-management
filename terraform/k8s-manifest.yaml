apiVersion: v1
kind: Namespace
metadata:
  name: employee-management
  labels:
    name: employee-management
    managed-by: terraform
    environment: production
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-atlas-secret
  namespace: employee-management
  labels:
    app: employee-management
    managed-by: terraform
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://dixongunasekara_db_user:fNLyS8evNG9G0yVF@cluster1.xhonozn.mongodb.net/employee-management?retryWrites=true&w=majority&serverSelectionTimeoutMS=5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-api
  namespace: employee-management
  labels:
    app: employee-management
    component: api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-management
      component: api
      tier: backend
  template:
    metadata:
      labels:
        app: employee-management
        component: api
        tier: backend
    spec:
      containers:
      - name: spring-boot-api
        image: employee-management-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-atlas-secret
              key: MONGODB_URI
        - name: SPRING_DATA_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-atlas-secret
              key: MONGODB_URI
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-api-service
  namespace: employee-management
  labels:
    app: employee-management
    component: api
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: employee-management
    component: api
    tier: backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: employee-management
  labels:
    app: employee-management
    component: ui
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-management
      component: ui
      tier: frontend
  template:
    metadata:
      labels:
        app: employee-management
        component: ui
        tier: frontend
    spec:
      containers:
      - name: react-frontend
        image: employee-management-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service
  namespace: employee-management
  labels:
    app: employee-management
    component: ui
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: employee-management
    component: ui
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-management-ingress
  namespace: employee-management
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: spring-boot-api-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-frontend-service
            port:
              number: 80
