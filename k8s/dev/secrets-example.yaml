# Kubernetes Secrets Template for Development Environment (app-em-test)
# 
# Usage:
# 1. Copy this file to k8s-dev/secrets.yaml:
#    cp k8s-dev/secrets-example.yaml k8s-dev/secrets.yaml
# 2. Fill in your actual base64 encoded or string values.
# 3. Apply via: kubectl apply -f k8s-dev/secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-atlas-secret
  namespace: app-em-test
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://<username>:<password>@cluster.mongodb.net/employee_db_dev?retryWrites=true&w=majority"
  ENCRYPTION_SECRET_KEY: "<YOUR_32_CHAR_ENCRYPTION_KEY>"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: app-em-test
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "<YOUR_GITHUB_USERNAME>",
          "password": "<YOUR_GITHUB_PAT>",
          "auth": "<BASE64_ENCODED_USER_COLON_PAT>"
        }
      }
    }
