# Kubernetes Secrets Template for Development Environment (app-em-dev)
#
# Option A (Recommended for ghcr-secret):
# Run this command directly to generate ghcr-secret automatically:
#   kubectl create secret docker-registry ghcr-secret \
#     --namespace=app-em-dev \
#     --docker-server=ghcr.io \
#     --docker-username=<YOUR_GITHUB_USERNAME> \
#     --docker-password=<YOUR_GITHUB_PAT>
#
# Option B (Manual file application):
# 1. Copy this file: cp k8s/dev/secrets-example.yaml k8s/dev/secrets.yaml
# 2. Compute auth: echo -n "USERNAME:PAT" | base64
# 3. Fill in values and apply: kubectl apply -f k8s/dev/secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-atlas-secret
  namespace: app-em-dev
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://<username>:<password>@cluster.mongodb.net/employee_db_dev?retryWrites=true&w=majority"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: app-em-dev
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "<YOUR_GITHUB_USERNAME>",
          "password": "<YOUR_GITHUB_PAT>",
          "auth": "<echo -n 'USERNAME:PAT' | base64>"
        }
      }
    }

