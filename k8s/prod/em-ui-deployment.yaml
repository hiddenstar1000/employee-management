apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: app-em-prod
  labels:
    app: employee-management
    component: ui
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-management
      component: ui
      tier: frontend
  template:
    metadata:
      labels:
        app: employee-management
        component: ui
        tier: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: react-frontend
          image: ghcr.io/hiddenstar1000/employee-management-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service
  namespace: app-em-prod
  labels:
    app: employee-management
    component: ui
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: employee-management
    component: ui
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
